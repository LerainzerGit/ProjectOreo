name: Build and Deploy Project Oreo

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y genisoimage mtools mono-devel

    - name: Build Project Oreo core
      run: |
        mcs Program.cs Sudo.cs -out:terminalos.exe

    - name: Build apps
      run: |
        mcs apps/miniedit/miniedit.cs -out:miniedit.exe
        mcs apps/snake/snake.cs -out:snake.exe
        mcs apps/sysinfo/sysinfo.cs -out:sysinfo.exe

    - name: Create ISO structure
      run: |
        mkdir iso
        mkdir iso/bin
        cp terminalos.exe iso/bin/
        cp miniedit.exe iso/bin/
        cp snake.exe iso/bin/
        cp sysinfo.exe iso/bin/
        cp $GITHUB_WORKSPACE/init.sh iso/
        chmod +x iso/init.sh

    - name: Build ISO
      run: |
        genisoimage -o ProjectOreo.iso iso/

    - name: Prepare Pages artifact
      run: |
        mkdir docs
        cp ProjectOreo.iso docs/
        cp docs/index.html docs/index.html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
