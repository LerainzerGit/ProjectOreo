name: Build and Deploy Project Oreo

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y mtools mono-devel

    - name: Build Project Oreo core
      run: |
        mcs Program.cs Sudo.cs -out:terminalos.exe

    - name: Build apps
      run: |
        mcs apps/miniedit/miniedit.cs -out:miniedit.exe
        mcs apps/snake/snake.cs -out:snake.exe
        mcs apps/sysinfo/sysinfo.cs -out:sysinfo.exe

    - name: Create FAT disk image
      run: |
        dd if=/dev/zero of=disk.img bs=1M count=64
        mkfs.vfat disk.img
        mmd -i disk.img ::/bin
        mcopy -i disk.img terminalos.exe ::/bin/
        mcopy -i disk.img miniedit.exe ::/bin/
        mcopy -i disk.img snake.exe ::/bin/
        mcopy -i disk.img sysinfo.exe ::/bin/
        mcopy -i disk.img init.sh ::

    - name: Create public folder
      run: |
        mkdir public
        cp disk.img public/
        cat << 'EOF' > public/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Project Oreo</title>
        </head>
        <body>
            <h1>Booting Project Oreo...</h1>
            <script src="https://v86.js.org/libv86.js"></script>
            <script>
                var emulator = new V86({
                    memory_size: 64 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,

                    // Your FAT disk image
                    hda: { url: "disk.img" },

                    // v86 kernel + initrd
                    kernel_url: "https://copy.sh/v86/buildroot-bzImage",
                    initrd_url: "https://copy.sh/v86/buildroot-initrd.img",

                    // Boot parameters
                    cmdline: "console=ttyS0 root=/dev/ram0",

                    autostart: true
                });
            </script>
        </body>
        </html>
        EOF

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
