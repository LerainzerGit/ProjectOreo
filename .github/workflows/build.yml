name: Build Project Oreo ISO + Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y genisoimage mtools mono-devel unzip wget

    - name: Build Project Oreo core
      run: |
        mcs Program.cs Sudo.cs -out:terminalos.exe

    - name: Build apps
      run: |
        mcs apps/miniedit/miniedit.cs -out:miniedit.exe
        mcs apps/snake/snake.cs -out:snake.exe
        mcs apps/sysinfo/sysinfo.cs -out:sysinfo.exe

    - name: Create ISO structure
      run: |
        mkdir iso
        mkdir iso/bin
        cp terminalos.exe iso/bin/
        cp miniedit.exe iso/bin/
        cp snake.exe iso/bin/
        cp sysinfo.exe iso/bin/
        cp init.sh iso/
        chmod +x iso/init.sh

    - name: Build ISO
      run: |
        genisoimage -o ProjectOreo.iso -b init.sh iso/

    - name: Download minimal v86
      run: |
        mkdir docs
        wget https://copy.sh/v86/build/v86.js -O docs/v86.js
        wget https://copy.sh/v86/build/v86.wasm -O docs/v86.wasm

    - name: Add boot page
      run: |
        cat << 'EOF' > docs/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Project Oreo</title>
        </head>
        <body>
            <h1>Booting Project Oreo...</h1>
            <script src="v86.js"></script>
            <script>
                var emulator = new V86({
                    wasm_path: "v86.wasm",
                    memory_size: 64 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,
                    cdrom: { url: "ProjectOreo.iso" },
                    autostart: true
                });
            </script>
        </body>
        </html>
        EOF

    - name: Copy ISO to docs
      run: cp ProjectOreo.iso docs/

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v3
      with:
        name: ProjectOreo
        path: ProjectOreo.iso
